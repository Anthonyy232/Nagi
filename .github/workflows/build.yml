name: Nagi CI/CD

on:
  # Every pull request runs the tests: they are the ruleset's required check.
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['*.*.*']
    # Docs and the site need no build, Azure deploy or signing request.
    paths-ignore:
      - site/**
      - '**.md'
      - .github/readme/**
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

# A newer push supersedes older runs: branch runs are cancelled, while master and tag runs finish
# so a deploy or signing request is never cut off, and only the newest waiting run is kept.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/Directory.Packages.props
            **/NuGet.config

      - uses: FedericoCarboni/setup-ffmpeg@v3.1

      - name: Run tests
        run: dotnet test --project tests/Nagi.Core.Tests/Nagi.Core.Tests.csproj -c Release --report-xunit-trx --report-xunit-trx-filename test-results.trx

      - name: Run view-model tests
        run: dotnet test --project tests/Nagi.Presentation.Tests/Nagi.Presentation.Tests.csproj -c Release --report-xunit-trx --report-xunit-trx-filename presentation-test-results.trx

      - name: Run WinUI tests
        run: dotnet test --project tests/Nagi.WinUI.Tests/Nagi.WinUI.Tests.csproj -c Release -p:Platform=x64 --report-xunit-trx --report-xunit-trx-filename winui-test-results.trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: '**/*test-results.trx'

  deploy-functions:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/Directory.Packages.props
            **/NuGet.config

      - run: dotnet publish api/NagiAppFunctions/NagiAppFunctions.csproj -c Release -o ./functions-output

      - name: Verify Functions worker dependency compatibility
        timeout-minutes: 2
        shell: pwsh
        run: |
          $output = & dotnet ./functions-output/NagiAppFunctions.dll 2>&1 | Out-String
          if ($output -match 'TypeLoadException|FileLoadException|MissingMethodException') {
            throw "Functions worker dependency compatibility check failed:`n$output"
          }
          if ($output -notmatch 'HostEndpoint') {
            throw "Functions worker did not reach the expected host configuration boundary:`n$output"
          }
          exit 0

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1.5.7
        with:
          app-name: nagiflexapiserver
          package: ./functions-output

  benchmark:
    name: Run Benchmarks
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Build.props
            **/Directory.Packages.props
            **/NuGet.config

      - uses: FedericoCarboni/setup-ffmpeg@v3.1

      # A short job catches large regressions and failed scans; the default job took over an hour on the 10,000-song case.
      - run: dotnet run -c Release --project benchmarks/Nagi.Benchmarks/Nagi.Benchmarks.csproj -- --filter *LibraryScanBenchmarks* --job Short --iterationCount 7 --warmupCount 2 --launchCount 1

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Benchmark-Results
          path: BenchmarkDotNet.Artifacts/results/

      - name: Write benchmark summary
        if: always()
        shell: pwsh
        run: |
          $md = Get-ChildItem "BenchmarkDotNet.Artifacts/results/*.md" | Select-Object -First 1
          if ($md) { Get-Content $md.FullName | Out-File $env:GITHUB_STEP_SUMMARY -Append }

  verify-api-connectivity:
    name: Verify API Connectivity
    runs-on: ubuntu-latest
    needs: [test, deploy-functions]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || needs.deploy-functions.result == 'success')
    steps:
      - name: Smoke test API
        timeout-minutes: 5
        env:
          API_KEY: ${{ secrets.NAGI_API_KEY }}
        run: |
          STATUS=$(curl --fail --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --retry 11 --retry-delay 10 --retry-all-errors --connect-timeout 5 --max-time 10 \
            -H "X-API-KEY: ${API_KEY}" \
            "https://nagiflexapiserver.azurewebsites.net/api/lastfm-key")
          test "$STATUS" -eq 200

  build-msix:
    name: Build MSIX Bundle
    runs-on: windows-latest
    needs: [test, verify-api-connectivity]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.verify-api-connectivity.result == 'success' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Patch manifest Publisher for sideload signing
        shell: pwsh
        env:
          CERT_SUBJECT: ${{ startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_CERT_SUBJECT || vars.SIGNPATH_TEST_CERT_SUBJECT || vars.SIGNPATH_CERT_SUBJECT }}
        run: |
          $manifest = "src/Nagi.WinUI/Package.appxmanifest"
          $xml = [xml](Get-Content $manifest -Raw)
          $xml.Package.Identity.Publisher = $env:CERT_SUBJECT
          $xml.Save((Join-Path $PWD $manifest))

      - uses: ./.github/actions/prebuild-winui
        with:
          discord-app-id: ${{ secrets.NAGI_DISCORD_KEY }}
          api-key: ${{ secrets.NAGI_API_KEY }}

      - name: Build MSIX bundle
        run: >
          dotnet msbuild src/Nagi.WinUI/Nagi.WinUI.csproj
          /p:Configuration=Release /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxBundle=Always /p:AppxBundlePlatforms="x64|ARM64"
          /p:AppxPackageSigningEnabled=False
          /p:PackageCertificateThumbprint=""
          /p:GenerateTemporaryStoreCertificate=False
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=${{ github.workspace }}/bundle-output/

      - name: Locate msixbundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "${{ github.workspace }}/bundle-output" -Recurse -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "msixbundle not found in bundle-output" }
          Copy-Item $bundle.FullName "${{ github.workspace }}/bundle-output/Nagi.msixbundle"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Unsigned-MSIX-${{ github.ref_name }}
          path: ${{ github.workspace }}/bundle-output/Nagi.msixbundle
          if-no-files-found: error

  # Own job: the sideload build patches the manifest Publisher, and the Store needs the original identity.
  build-store:
    name: Build Store Package
    runs-on: windows-latest
    needs: [test, verify-api-connectivity]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.verify-api-connectivity.result == 'success' &&
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/prebuild-winui
        with:
          discord-app-id: ${{ secrets.NAGI_DISCORD_KEY }}
          api-key: ${{ secrets.NAGI_API_KEY }}

      # Symbol packages need mspdbcmf for every platform pass, or the .appxsym files are left out.
      - name: Locate mspdbcmf
        id: mspdbcmf
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = Get-ChildItem "$vs/VC/Tools/MSVC" | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $x64 = Join-Path $msvc.FullName 'bin/Hostx64/x64/mspdbcmf.exe'
          $x86 = Join-Path $msvc.FullName 'bin/Hostx64/x86/mspdbcmf.exe'
          if (-not (Test-Path $x64) -or -not (Test-Path $x86)) { throw "mspdbcmf.exe not found under $($msvc.FullName)" }
          echo "x64=$x64" >> $env:GITHUB_OUTPUT
          echo "x86=$x86" >> $env:GITHUB_OUTPUT

      - name: Build Store upload package
        run: >
          dotnet msbuild src/Nagi.WinUI/Nagi.WinUI.csproj
          /p:Configuration=Release /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxBundle=Always /p:AppxBundlePlatforms="x64|ARM64"
          /p:AppxPackageSigningEnabled=False
          /p:PackageCertificateThumbprint=""
          /p:GenerateTemporaryStoreCertificate=False
          /p:UapAppxPackageBuildMode=StoreUpload
          "/p:MsPdbCmfExeFullpath=${{ steps.mspdbcmf.outputs.x64 }}"
          "/p:PdbCmfx64ExeFullPath=${{ steps.mspdbcmf.outputs.x64 }}"
          "/p:PdbCmfx86ExeFullPath=${{ steps.mspdbcmf.outputs.x86 }}"
          /p:AppxPackageDir=${{ github.workspace }}/store-output/

      - name: Locate msixupload
        shell: pwsh
        run: |
          $upload = Get-ChildItem "${{ github.workspace }}/store-output" -Recurse -Filter *.msixupload | Select-Object -First 1
          if (-not $upload) { throw "msixupload not found in store-output" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($upload.FullName)
          $entries = $zip.Entries.Name
          $zip.Dispose()
          if (-not ($entries -like '*.appxsym')) { throw "msixupload has no symbol packages" }
          Copy-Item $upload.FullName "${{ github.workspace }}/store-output/Nagi.msixupload"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Store-MSIX-${{ github.ref_name }}
          path: ${{ github.workspace }}/store-output/Nagi.msixupload
          if-no-files-found: error

  sign-msix:
    name: Sign MSIX (SignPath)
    runs-on: ubuntu-latest
    needs: build-msix
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: Nagi
          artifact-configuration-slug: msixbundle
          signing-policy-slug: test-signing
          github-artifact-id: '${{ needs.build-msix.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ./signed
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Signed-MSIX
          path: ./signed/
