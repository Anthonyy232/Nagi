name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag version to release (e.g., 1.0.0)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sign-msix:
    name: Sign MSIX (SignPath)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Resolve release commit
        id: tag
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download unsigned MSIX from build workflow
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build.yml
          workflow_conclusion: success
          commit: ${{ steps.tag.outputs.commit }}
          event: push
          name: Unsigned-MSIX-${{ inputs.tag }}
          search_artifacts: true

      # SignPath needs an artifact belonging to this signing run.
      - name: Re-upload for SignPath
        id: reupload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Unsigned-MSIX-For-Signing
          path: Nagi.msixbundle
          if-no-files-found: error

      - uses: signpath/github-action-submit-signing-request@v2.2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: Nagi
          artifact-configuration-slug: msixbundle
          signing-policy-slug: release-signing
          github-artifact-id: '${{ steps.reupload.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ./signed
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Signed-MSIX
          path: ./signed/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: sign-msix
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Download signed MSIX
        uses: actions/download-artifact@v8.0.1
        with:
          name: Signed-MSIX
          path: ./signed

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.AppxPackageVersion
          echo "value=$v" >> $env:GITHUB_OUTPUT

      - name: Generate .appinstaller
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
          CERT_SUBJECT: ${{ vars.SIGNPATH_CERT_SUBJECT }}
        run: |
          $baseUrl = "https://github.com/$env:REPO/releases/latest/download"
          $xml = [xml]@'
          <?xml version="1.0" encoding="utf-8"?>
          <AppInstaller xmlns="http://schemas.microsoft.com/appx/appinstaller/2018">
            <MainBundle Name="48743Nagi.Nagi"/>
            <UpdateSettings>
              <OnLaunch HoursBetweenUpdateChecks="0"/>
            </UpdateSettings>
          </AppInstaller>
          '@
          $xml.AppInstaller.SetAttribute('Uri', "$baseUrl/Nagi.appinstaller")
          $xml.AppInstaller.SetAttribute('Version', $env:VERSION)
          $xml.AppInstaller.MainBundle.SetAttribute('Version', $env:VERSION)
          $xml.AppInstaller.MainBundle.SetAttribute('Publisher', $env:CERT_SUBJECT)
          $xml.AppInstaller.MainBundle.SetAttribute('Uri', "$baseUrl/Nagi.msixbundle")
          $xml.Save((Join-Path $PWD 'signed/Nagi.appinstaller'))

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --title "Version $RELEASE_TAG" \
            --draft \
            signed/Nagi.msixbundle \
            signed/Nagi.appinstaller
