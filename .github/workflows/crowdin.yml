name: Crowdin Sync

on:
  push:
    branches: [ master ]
    paths:
      - src/Nagi.Core/Resources/Strings.resx
      - src/Nagi.Presentation/Resources/Strings.resx
      - src/Nagi.WinUI/Strings/en-US/Resources.resw
      - crowdin.yml
      - .github/workflows/crowdin.yml
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: crowdin-sync

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  BRANCH: crowdin-translations

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Note the translations branch
        id: before
        run: echo "sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Crowdin Action
        uses: crowdin/github-action@v3.3.0
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'New Crowdin translations'
          pull_request_base_branch_name: 'master'
          localization_branch_name: ${{ env.BRANCH }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub holds CI on PRs opened with GITHUB_TOKEN until someone approves the run,
      # but a dispatch from the same token runs straight away and reports on the PR's commit.
      - name: Run CI on new translations
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          after=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$after" ] && [ "$after" != "$BEFORE" ]; then
            gh workflow run build.yml --ref "$BRANCH"
          fi
