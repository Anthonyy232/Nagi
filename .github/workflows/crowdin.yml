name: Crowdin Sync

on:
  push:
    branches: [ master ]
    paths:
      - src/Nagi.Core/Resources/Strings.resx
      - src/Nagi.Presentation/Resources/Strings.resx
      - src/Nagi.WinUI/Strings/en-US/Resources.resw
      - crowdin.yml
      - .github/workflows/crowdin.yml
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      upload_translations:
        description: Send the translations in the repository to Crowdin first
        type: boolean
        default: false

concurrency:
  group: crowdin-sync

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  BRANCH: crowdin-translations

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Note the translations branch
        id: before
        run: echo "sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Crowdin Action
        uses: crowdin/github-action@d651c77756acbe11a31d77a6fb79d8a239e1e05a # v3.6.0
        with:
          upload_sources: true
          upload_translations: ${{ inputs.upload_translations || false }}
          import_eq_suggestions: true
          download_translations: true
          create_pull_request: true
          pull_request_title: 'chore: update translations'
          commit_message: 'chore: update translations'
          pull_request_base_branch_name: 'master'
          localization_branch_name: ${{ env.BRANCH }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub holds CI on PRs opened with GITHUB_TOKEN until someone approves the run,
      # but a dispatch from the same token runs straight away and reports on the PR's commit.
      - name: Run CI on new translations
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          after=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$after" ] && [ "$after" != "$BEFORE" ]; then
            gh workflow run build.yml --ref "$BRANCH"
          fi
