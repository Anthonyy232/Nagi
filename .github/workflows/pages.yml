name: Site

on:
  push:
    branches: [master]
    paths:
      - site/**
      - media/AppLogo*.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      # The logo has one source, media/.
      - run: cp media/AppLogo.svg media/AppLogo-small.svg site/

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5.0.1
