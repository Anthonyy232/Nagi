project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .

preserve_hierarchy: true

# Untranslated strings are left out of the exported files so .NET and MRT fall back to the
# English source, instead of Crowdin copying English text into every locale.
files:
  - source: /src/Nagi.Core/Resources/Strings.resx
    translation: /src/Nagi.Core/Resources/Strings.%locale%.resx
    skip_untranslated_strings: true
    languages_mapping:
      locale:
        ar: ar
        sr: sr-Cyrl-RS
        zh-CN: zh-Hans
        zh-TW: zh-Hant

  - source: /src/Nagi.Presentation/Resources/Strings.resx
    translation: /src/Nagi.Presentation/Resources/Strings.%locale%.resx
    skip_untranslated_strings: true
    languages_mapping:
      locale:
        ar: ar
        sr: sr-Cyrl-RS
        zh-CN: zh-Hans
        zh-TW: zh-Hant

  - source: /src/Nagi.WinUI/Strings/en-US/Resources.resw
    translation: /src/Nagi.WinUI/Strings/%locale%/Resources.resw
    skip_untranslated_strings: true
    languages_mapping:
      locale:
        ar: ar
        sr: sr-Cyrl-RS
        zh-CN: zh-Hans
        zh-TW: zh-Hant
