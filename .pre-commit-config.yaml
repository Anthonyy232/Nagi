exclude: ^tools/romanization-packs/dist/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        language: system
        entry: dotnet format --include
        types: [c#]
        pass_filenames: true

      - id: xaml-styler
        name: xaml styler
        language: system
        entry: dotnet tool run xstyler -- -c Settings.XamlStyler -f
        files: \.xaml$
        pass_filenames: true
